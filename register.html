<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excellent Trading</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <section class="container">
        <header>Create a New Account!</header>
        <p class="qfs">Get your free QFS LEDGER account now!</p>
        <form action="#" class="form">
            <div class="new-name">
                <div class="input-box">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter full name" required>
                </div>
            
                <div class="input-box">
                    <label>Username</label>
                    <input type="text" placeholder="Enter username" required>
                </div>
            </div>    
            <div class="new-name">
                <div class="input-box">
                    <label>Email address</label>
                    <input type="email" placeholder="Enter email" required>
                </div>
            
                <div class="input-box">
                    <label>Retype Email</label>
                    <input type="email" placeholder="Enter email" required>
                </div>
            </div>
            <div class="new-name">
                <div class="input-box">
                    <label>Enter Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
            
                <div class="input-box">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Enter password" required>
                </div>
            </div>
            <div class="column">
                <div class="input-box">
                <label>Phone Number</label>
                <input type="number" placeholder="Enter phone number" required>
            </div>
            <div class="input-box">
                <label>Birth Date</label>
                <input type="date" placeholder="Enter birth date" required>
            </div>
            </div>
            <div class="gender-box">
                <h3>Gender</h3>
                <div class="gender-option">
                    <div class="gender">
                        <input type="radio" id="check-male" name="gender" checked>   
                       <label for="check">Male</label>            
                    </div>
                    <div class="gender">
                        <input type="radio" id="check-female" name="gender" checked>   
                       <label for="check">Female</label>            
                    </div>
                    <div class="gender">
                        <input type="radio" id="check-other" name="gender" checked>   
                       <label for="check">Prefer not to say</label>            
                    </div>
                </div>
            </div>
            <div class="input-box addres">
                <label>Address</label>
                <input type="text" placeholder="Enter street address" required>
                <input type="text" placeholder="Enter street address line 2" required>
                <div class="column">
                    <div class="select-box">
                        <select>
                            <option hidden>Country</option>
                            <option>America</option>
                            <option>England</option>
                            <option>France</option>
                            <option>Nigeria</option>
                            <option>Japan</option>
                            <option>Ghana</option>
                            <option>Senegal</option>
                            <option>Cote D'Ivoire</option>
                            <option>Egypt</option>
                        </select>    
                    </div>
                    <div class="city">
                        <input type="text" placeholder="Enter your city" required>
                    </div>
                </div>
                <div class="column">
                    <input type="text" placeholder="Enter your region" required>
                    <input type="number" placeholder="Enter your postal code" required>
                </div>
             </div>
             <div class="enquiry">
                 <p><i>By registering you agree to the QFS LEDGER <span><a href="#">Terms of use</a></span>  </i></p>
             </div>
             <button>Submit</button>
             <div class="account">
                 <p>Already have an account? <span><a href="login.html">Signin</a></span></p>
             </div>
        </form>
    </section>    
</body>
</html>
